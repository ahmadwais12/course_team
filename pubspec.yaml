name: course_emis
description: "Revolutionize language education with a comprehensive Flutter-powered management system, seamlessly integrating academic, financial, and HR functions into one vibrant, fully responsive platform."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  general_datetime: ^2.1.0
  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  iconsax: ^0.0.8
  font_awesome_flutter: ^10.7.0
  loading_animation_widget: ^1.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.3
  
  # Backend & Auth
  supabase_flutter: ^2.16.0
  dio: ^5.9.2
  http: ^1.2.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  get: ^4.7.3
  json_annotation: ^4.9.0
  
  # Responsive
  responsive_framework: ^1.5.1
  flutter_screenutil: ^5.9.3
  responsive_grid: ^2.4.3
  
  # Navigation
  go_router: ^17.3.0
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.0.0
  flutter_secure_storage: ^10.3.1
  
  # Utilities
  intl: 0.20.2
  uuid: ^4.5.3
  firebase_core: any
  firebase_messaging: ^16.4.1
  logger: ^2.0.2
  path: any
  timezone: any
  
  # Biometric Auth
  local_auth: ^3.0.1
  
  # File Handling
  image_picker: ^1.0.7
  path_provider: any

  # PDF & Export
  pdf: ^3.10.7
  
  # Video Player
  video_player: ^2.8.2
  chewie: ^1.7.5
  
  # Security & Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Image Optimization
  cached_network_image: ^3.4.1
  flutter_cache_manager: any
  
  # Notifications & UI Feedback
  flutter_local_notifications: ^22.0.1
  fluttertoast: ^9.0.0
  app_badge_plus: ^1.1.4
  
  # Carousel & Web
  carousel_slider: ^5.1.2
  flutter_html: ^3.0.0-beta.2
  flutter_inappwebview: ^6.0.0
  
  # Device Info & Permissions
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  
  # App Updates
  in_app_update: ^4.2.2
  upgrader: ^12.5.0
  flutter_launcher_icons: ^0.14.4
  animated_text_kit: ^4.3.0
  animations: ^2.2.0
  flutter_svg: ^2.3.0
  dotlottie_flutter: ^0.1.4
  flex_color_scheme: ^8.4.0
  syncfusion_flutter_charts: ^34.1.30
  graphview: ^1.5.1
  syncfusion_flutter_datagrid: ^34.1.30
  awesome_notifications: ^0.12.1
  overlay_support: ^2.1.0
  top_snackbar_flutter: ^3.3.0
  flutter_chat_ui: ^2.11.1
  google_mobile_ads: ^9.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/dreamflow-icon-filled-256.png
  adaptive_icon_background: "#152331"
#  adaptive_icon_foreground: assets/logo/dreamflow-icon-filled-256.png
  remove_alpha_ios: true
